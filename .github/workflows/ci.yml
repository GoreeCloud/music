name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MUSIC_SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Music source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.MUSIC_SOURCE_REVISION }}
          fetch-depth: 1
      - name: Verify exact Music source revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$MUSIC_SOURCE_REVISION"
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files require gofmt with Go 1.27.1:"
            echo "$unformatted"
            gofmt -d . || true
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build service
        run: go build ./cmd/musicd
